<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS_madoka</title>
    <style>
        h1{
            color: white;
            background-color: deeppink;
            text-align: center;
            font-size: 56px;
            margin-left: 25%;
            margin-right: 25%;
        }
        h1:hover{
            background-color: white;
            color: deeppink;
        }
        h2:hover{
            text-decoration: underline;
        }
        p{
            color:rgb(255, 255, 255);
            text-align: center;
            font-size: 24px;
        }
        p:hover{
            text-decoration: underline;
        }
        h2{
            color: deeppink;
            text-align: center;
            font-size: 32px
        }
        h1, h2, h3, p{
            font-family:monospace;
        }
        .madoka:hover{
            transform: scale(1.2);
        }
    </style>
</head>
<body style="background-color: black" >
    <h1>Manuela Pires Abdo</h1>
    <p>Estudante de desenvolvimento de sistemas</p>
    <h2>Bem vindo à minha página! <3</h2>
    <img class="madoka" src="https://images2.alphacoders.com/746/thumb-1920-746648.jpg"  style="display: block; margin: 0 auto; width: 500px;">
    <p>Madokaaaaa</p>
</body>
</html>
